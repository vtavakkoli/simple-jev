<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480" role="img" aria-labelledby="title"><title id="title">Explicit backend selection and validated decisions</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="m0 0 8 4-8 4" fill="#4b8076"/></marker></defs><rect width="1100" height="480" rx="24" fill="#f1f6f3"/><g font-family="Arial, sans-serif" fill="#173f41"><text x="42" y="53" font-size="24" font-weight="bold">One workflow. An explicit backend.</text><g stroke="#bdd3c8" fill="#fff"><rect x="42" y="175" width="220" height="130" rx="16"/><rect x="350" y="102" width="300" height="112" rx="16"/><rect x="350" y="266" width="300" height="112" rx="16"/><rect x="748" y="175" width="310" height="130" rx="16"/></g><g font-size="20" font-weight="bold"><text x="64" y="219" font-size="18">State + questions</text><text x="374" y="140">TypeSafe JEV API</text><text x="374" y="304">Local Simple Jev</text><text x="772" y="217">Validate → decide</text></g><g font-size="16" fill="#526d64"><text x="64" y="254">Choose one backend</text><text x="374" y="176">Hosted model • API key</text><text x="374" y="340">HF model • label logits</text><text x="772" y="251">Choice / Score / Noul</text><text x="772" y="279">Application rules + review</text><text x="42" y="438">No silent fallback. Record the backend, model and latency with every decision.</text></g><g fill="none" stroke="#4b8076" stroke-width="2" marker-end="url(#arrow)"><path d="M262 213h42v-55h46"/><path d="M262 269h42v53h46"/><path d="M650 158h44v55h54"/><path d="M650 322h44v-55h54"/></g></g></svg>