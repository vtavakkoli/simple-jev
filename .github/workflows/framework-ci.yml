name: Framework CI

on:
  pull_request:
  push:
    branches:
      - main
      - "feat/**"

permissions:
  contents: read

concurrency:
  group: framework-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  framework-tests:
    name: Python 3.12 / CPU
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: hf-server/pyproject.toml

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install CPU PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.6"

      - name: Install Simple-JEV with test dependencies
        run: python -m pip install -e './hf-server[test]'

      - name: Compile Python sources
        run: python -m compileall -q common hf-server

      - name: Check CLI wiring
        run: simple-jev --help > /dev/null

      - name: Run framework tests
        run: python -m pytest -c hf-server/pyproject.toml common/tests hf-server/tests -q
