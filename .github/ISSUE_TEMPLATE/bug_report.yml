name: Bug report
description: Report a reproducible problem in the client, server, website or notebook.
title: "[Bug]: "
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Python client / CLI
        - Local HF server
        - Hosted JEV notebook
        - Local model notebook
        - Website / playground
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include commands, commit, Python version, backend and model. Remove secrets and private data.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized error output
      render: text
